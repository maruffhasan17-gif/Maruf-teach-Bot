    </div>
    <script>
      // Active 60fps Spin Animation Loop (no conflicting CSS animation on #splash-flower-outer/inner)
      (function() {
        var outer = document.getElementById('splash-flower-outer');
        var inner = document.getElementById('splash-flower-inner');
        var degOuter = 0;
        var degInner = 0;
        var lastTime = performance.now();
        function animateFlower(time) {
          var splash = document.getElementById('splash-loader');
          if (!splash) return;
          var dt = (time - lastTime) / 1000;
          lastTime = time;
          if (dt > 0.3 || dt < 0) dt = 0.016;
          degOuter = (degOuter + dt * 45) % 360;
          degInner = (degInner - dt * 60) % 360;
          if (outer) {
            outer.style.webkitTransform = 'rotate(' + degOuter.toFixed(2) + 'deg)';
            outer.style.transform = 'rotate(' + degOuter.toFixed(2) + 'deg)';
          }
          if (inner) {
            inner.style.webkitTransform = 'rotate(' + degInner.toFixed(2) + 'deg)';
            inner.style.transform = 'rotate(' + degInner.toFixed(2) + 'deg)';
          }
          requestAnimationFrame(animateFlower);
        }
        requestAnimationFrame(animateFlower);
      })();
    </script>
  </body>
</html>
