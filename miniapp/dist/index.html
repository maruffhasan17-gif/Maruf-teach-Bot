<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Trust Pay</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>body{background-color:#f8fafc;margin:0;overflow-x:hidden}@keyframes pulseLogo{0%,to{filter:drop-shadow(0 8px 24px #4f46e559);transform:scale(1)}50%{filter:drop-shadow(0 14px 32px #6366f18c);transform:scale(1.06)}}@keyframes progBar{0%{transform:translate(-100%)}50%{transform:translate(20%)}to{transform:translate(100%)}}</style>
    <script type="module" crossorigin src="/app/assets/index-D99iHSg9.js"></script>
    <link rel="stylesheet" crossorigin href="/app/assets/index-WX-NfQzb.css">
  </head>
  <body>
    <div id="root">
      <div id="splash-loader" style="position:fixed;inset:0;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;z-index:99999;padding:20px;box-sizing:border-box;text-align:center;">
        <div style="width:96px;height:96px;display:flex;align-items:center;justify-content:center;position:relative;">
          <img src="/app/trustpaylogo.png" onerror="this.onerror=null;this.src='./trustpaylogo.png';" style="width:96px;height:96px;object-fit:contain;animation:pulseLogo 2.2s infinite ease-in-out;" alt="Trust Pay" />
        </div>
        <div style="margin-top:16px;font-size:22px;font-weight:900;color:#0f172a;letter-spacing:-0.02em;">Trust Pay</div>
        <div style="margin-top:6px;font-size:12px;font-weight:600;color:#64748b;letter-spacing:0.01em;">লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</div>
        <div style="width:140px;height:4px;background:#e2e8f0;border-radius:99px;margin-top:20px;overflow:hidden;position:relative;">
          <div style="position:absolute;inset:0;background:linear-gradient(90deg,#4f46e5,#6366f1);border-radius:99px;animation:progBar 1.4s infinite ease-in-out;"></div>
        </div>
      </div>
    </div>
    <script>
      // Fallback: If React does not mount within 4.5 seconds (e.g. Render spin-up or network lag), provide a reload button
      setTimeout(function() {
        var loader = document.getElementById('splash-loader');
        if (loader && !document.getElementById('retry-btn')) {
          var btn = document.createElement('button');
          btn.id = 'retry-btn';
          btn.innerText = '🔄 রিলোড করুন (Reload)';
          btn.style.cssText = 'margin-top:22px;padding:9px 20px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border:none;font-weight:bold;font-size:13px;cursor:pointer;box-shadow:0 6px 18px rgba(79,70,229,0.35);transition:all 0.2s;';
          btn.onclick = function() { window.location.reload(true); };
          loader.appendChild(btn);
        }
      }, 4500);
    </script>
  </body>
</html>
