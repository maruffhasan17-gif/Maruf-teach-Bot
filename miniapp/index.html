<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Crypto Buy Sell</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        margin: 0;
        background-color: #f8fafc;
        overflow-x: hidden;
      }
      @keyframes pulseCoin {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 6px 16px rgba(16,185,129,0.25)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 10px 24px rgba(16,185,129,0.45)); }
      }
      @keyframes progBar {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(20%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash-loader" style="position:fixed;inset:0;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;z-index:99999;">
        <img src="./logo.png" style="width:84px;height:84px;object-fit:contain;animation:pulseCoin 2s infinite ease-in-out;" alt="Crypto Buy Sell" />
        <div style="margin-top:18px;font-size:20px;font-weight:900;color:#0f172a;letter-spacing:-0.02em;">Crypto Buy Sell</div>
        <div style="margin-top:5px;font-size:12px;font-weight:600;color:#64748b;letter-spacing:0.01em;">লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</div>
        <div style="width:130px;height:4px;background:#e2e8f0;border-radius:99px;margin-top:20px;overflow:hidden;position:relative;">
          <div style="position:absolute;inset:0;background:linear-gradient(90deg,#10b981,#059669);border-radius:99px;animation:progBar 1.4s infinite ease-in-out;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
